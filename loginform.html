<!DOCTYPE html>
<html lang="en">
<head>
    <style>

        form{
            border: 2px solid black;
            padding: 30px;
            background-color: whitesmoke;
            border-radius: 50px ;
        }
        body{
            background-color: lightblue;
        }
        .row{
            display: flex;
            align-items: center;
        }
        label{
            width: 100px;
        }
        .box1{
            display: grid;
            place-items: center;
            height: 100vh;
            width: 100vw;
        }

    </style>
</head>
<body>
    <div class="box1">
        <form>
        <div class="row">
        <label>E-Mail : </label>
        <input type="email" name="email" placeholder="abc@gmail.com">
        </div>
        <br><br>
        <div class="row">
        <label>Password : </label>
        <input type="password" name="password" placeholder="password" minlength="8">
        </div>
    </form>
    </div>
</body>
</html>
